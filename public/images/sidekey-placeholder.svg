<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e2e8f0" />
    </linearGradient>

    <!-- Metallic Button Gradient -->
    <linearGradient id="metalGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#64748b" />
      <stop offset="50%" stop-color="#334155" />
      <stop offset="100%" stop-color="#1e293b" />
    </linearGradient>

    <!-- Chrome Highlight Gradient -->
    <linearGradient id="chromeGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="40%" stop-color="#cbd5e1" />
      <stop offset="70%" stop-color="#64748b" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Gold Contact Pin Gradient -->
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fde047" />
      <stop offset="100%" stop-color="#d97706" />
    </linearGradient>

    <!-- Red Accent Gradient -->
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ef4444" />
      <stop offset="100%" stop-color="#b91c1c" />
    </linearGradient>

    <filter id="shadow" x="-10%" y="-10%" width="120%" height="125%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0f172a" flood-opacity="0.15" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="400" height="400" rx="24" fill="url(#bgGrad)" />

  <!-- Subtle Blueprint Grid Pattern -->
  <g opacity="0.15" stroke="#94a3b8" stroke-width="1">
    <line x1="40" y1="0" x2="40" y2="400" stroke-dasharray="4 4" />
    <line x1="80" y1="0" x2="80" y2="400" stroke-dasharray="4 4" />
    <line x1="120" y1="0" x2="120" y2="400" stroke-dasharray="4 4" />
    <line x1="160" y1="0" x2="160" y2="400" stroke-dasharray="4 4" />
    <line x1="200" y1="0" x2="200" y2="400" stroke-dasharray="4 4" />
    <line x1="240" y1="0" x2="240" y2="400" stroke-dasharray="4 4" />
    <line x1="280" y1="0" x2="280" y2="400" stroke-dasharray="4 4" />
    <line x1="320" y1="0" x2="320" y2="400" stroke-dasharray="4 4" />
    <line x1="360" y1="0" x2="360" y2="400" stroke-dasharray="4 4" />
    
    <line x1="0" y1="40" x2="400" y2="40" stroke-dasharray="4 4" />
    <line x1="0" y1="80" x2="400" y2="80" stroke-dasharray="4 4" />
    <line x1="0" y1="120" x2="400" y2="120" stroke-dasharray="4 4" />
    <line x1="0" y1="160" x2="400" y2="160" stroke-dasharray="4 4" />
    <line x1="0" y1="200" x2="400" y2="200" stroke-dasharray="4 4" />
    <line x1="0" y1="240" x2="400" y2="240" stroke-dasharray="4 4" />
    <line x1="0" y1="280" x2="400" y2="280" stroke-dasharray="4 4" />
    <line x1="0" y1="320" x2="400" y2="320" stroke-dasharray="4 4" />
    <line x1="0" y1="360" x2="400" y2="360" stroke-dasharray="4 4" />
  </g>

  <!-- Phone Frame Outline (Ghosted in background) -->
  <rect x="70" y="45" width="220" height="310" rx="30" fill="none" stroke="#cbd5e1" stroke-width="2.5" opacity="0.6" />
  
  <!-- Right edge phone highlight showing where side keys fit -->
  <line x1="290" y1="85" x2="290" y2="315" stroke="#94a3b8" stroke-width="4" stroke-linecap="round" opacity="0.5" />

  <!-- MAIN SIDE KEY BUTTON 1: Volume Up / Down Rocker Assembly -->
  <g filter="url(#shadow)">
    <!-- Base Ribbon / Bracket -->
    <path d="M 270 95 L 305 95 Q 312 95 312 102 L 312 198 Q 312 205 305 205 L 270 205 Q 265 205 265 198 L 265 102 Q 265 95 270 95 Z" fill="#475569" />
    
    <!-- Outer Metallic Volume Rocker Button -->
    <rect x="296" y="100" width="18" height="100" rx="9" fill="url(#chromeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="299" y="103" width="12" height="94" rx="6" fill="url(#metalGrad)" />

    <!-- Volume + Symbol (Engraved) -->
    <line x1="305" y1="120" x2="305" y2="132" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />
    <line x1="299" y1="126" x2="311" y2="126" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />

    <!-- Divider Notch -->
    <line x1="301" y1="150" x2="309" y2="150" stroke="#0f172a" stroke-width="2" />

    <!-- Volume - Symbol (Engraved) -->
    <line x1="299" y1="174" x2="311" y2="174" stroke="#e2e8f0" stroke-width="2.5" stroke-linecap="round" />

    <!-- Gold Contact Test Points (Flex Cable Details) -->
    <circle cx="277" cy="115" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <circle cx="277" cy="135" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <circle cx="277" cy="165" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <circle cx="277" cy="185" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />

    <!-- Yellow Copper Flex Trace Lines -->
    <path d="M 277 119 L 277 131 M 277 169 L 277 181" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- MAIN SIDE KEY BUTTON 2: Power / Lock Button -->
  <g filter="url(#shadow)">
    <!-- Base Ribbon -->
    <path d="M 270 230 L 305 230 Q 312 230 312 236 L 312 294 Q 312 300 305 300 L 270 300 Q 265 300 265 294 L 265 236 Q 265 230 270 230 Z" fill="#475569" />

    <!-- Outer Metallic Power Key -->
    <rect x="296" y="234" width="18" height="62" rx="9" fill="url(#chromeGrad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="299" y="237" width="12" height="56" rx="6" fill="url(#metalGrad)" />

    <!-- Power Icon (Engraved) -->
    <path d="M 302 260 A 4.5 4.5 0 1 0 308 260" fill="none" stroke="#f87171" stroke-width="2" stroke-linecap="round" />
    <line x1="305" y1="254" x2="305" y2="260" stroke="#f87171" stroke-width="2" stroke-linecap="round" />

    <!-- Gold Contact Test Points -->
    <circle cx="277" cy="250" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <circle cx="277" cy="280" r="4.5" fill="url(#goldGrad)" stroke="#b45309" stroke-width="1" />
    <path d="M 277 254 L 277 276" stroke="#eab308" stroke-width="2" stroke-linecap="round" />
  </g>

  <!-- Individual Replacement Key Buttons (Trio Set Displayed on Left) -->
  <g filter="url(#shadow)">
    <!-- Button 1 (Power Key Cap) -->
    <rect x="110" y="110" width="110" height="24" rx="8" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="113" y="113" width="104" height="18" rx="6" fill="url(#metalGrad)" />
    <!-- Prongs / Mounting Clips -->
    <rect x="125" y="132" width="6" height="8" rx="1.5" fill="#475569" />
    <rect x="189" y="132" width="6" height="8" rx="1.5" fill="#475569" />
    <!-- Power Icon -->
    <circle cx="165" cy="122" r="5" fill="none" stroke="#94a3b8" stroke-width="1.5" />
    <line x1="165" y1="117" x2="165" y2="121" stroke="#94a3b8" stroke-width="1.5" />

    <!-- Button 2 (Volume Up Key Cap) -->
    <rect x="110" y="160" width="110" height="24" rx="8" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="113" y="163" width="104" height="18" rx="6" fill="url(#metalGrad)" />
    <!-- Prongs -->
    <rect x="125" y="182" width="6" height="8" rx="1.5" fill="#475569" />
    <rect x="189" y="182" width="6" height="8" rx="1.5" fill="#475569" />
    <text x="165" y="176" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="900" fill="#94a3b8" text-anchor="middle">+</text>

    <!-- Button 3 (Volume Down Key Cap) -->
    <rect x="110" y="210" width="110" height="24" rx="8" fill="url(#chromeGrad)" stroke="#334155" stroke-width="1.5" />
    <rect x="113" y="213" width="104" height="18" rx="6" fill="url(#metalGrad)" />
    <!-- Prongs -->
    <rect x="125" y="232" width="6" height="8" rx="1.5" fill="#475569" />
    <rect x="189" y="232" width="6" height="8" rx="1.5" fill="#475569" />
    <text x="165" y="226" font-family="system-ui, -apple-system, sans-serif" font-size="16" font-weight="900" fill="#94a3b8" text-anchor="middle">-</text>
  </g>

  <!-- Badge at Bottom Center -->
  <g transform="translate(200, 335)">
    <!-- Pill Background -->
    <rect x="-115" y="-18" width="230" height="36" rx="18" fill="#0f172a" />
    
    <!-- Red Accent dot -->
    <circle cx="-92" cy="0" r="5" fill="url(#accentGrad)" />

    <!-- Text -->
    <text x="-78" y="5" font-family="system-ui, -apple-system, sans-serif" font-size="12" font-weight="800" fill="#ffffff" letter-spacing="1.5">
      SIDE KEY BUTTONS
    </text>
  </g>

  <!-- Genuine Quality Tag at Top Left -->
  <g transform="translate(30, 32)">
    <rect x="0" y="0" width="130" height="24" rx="6" fill="#dc2626" />
    <text x="65" y="16" font-family="system-ui, -apple-system, sans-serif" font-size="10" font-weight="800" fill="#ffffff" text-anchor="middle" letter-spacing="0.8">
      ORIGINAL REPAIR PART
    </text>
  </g>
</svg>
